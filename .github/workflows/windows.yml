# Windows, on demand.
#
# Not part of `check`, and deliberately not on push. Windows is NOT a supported
# platform: it compiles, and `crosscheck` inside the gate proves that on every
# run, but nothing has been run or tested there. This workflow is how that
# changes — run it, read what breaks, fix what is worth fixing, and when it
# passes consistently it earns a place in the main matrix and a line in the
# README.
#
# Manual for one reason only: a red badge for a platform nobody claims to
# support teaches people to ignore red badges. Cost is not the reason —
# GitHub-hosted standard runners are free and unmetered on public
# repositories, windows included.
#
# Expect failures the first time. Known differences going in: the runner
# spawns a child instead of replacing its process image, terminal detection is
# a stub that always answers yes, proc.Find needs pgrep and reports
# ErrUnsupported, and kit/lock cannot verify liveness so it falls back to
# StaleAfter. Tests that shell out to docker, ssh or a POSIX shell will skip or
# fail; whether they should skip or be made to work is the actual question
# this workflow exists to answer.
name: windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: kit/go.mod
          cache-dependency-path: "**/go.sum"

      # Not `task check`: that runs the documentation gates, the race detector
      # and a three-OS cross-build, none of which say anything new here. The
      # question is narrower — does the code RUN on Windows — so this is the
      # tests, and nothing else.
      #
      # continue-on-error because the answer is expected to be "not yet": a
      # failed step should produce a readable list of what broke, not a
      # cancelled run that stops at the first package. The summary step below
      # is what keeps that honest — see the comment there.
      #
      # The MODULE-PATH pattern, never "./...": the repository root is a
      # workspace root and not a module, so a relative pattern fails with
      # "directory prefix . does not contain modules listed in go.work". The
      # first version of this workflow used "./..." and reported a green job
      # having run zero tests.
      - name: Test
        id: test
        continue-on-error: true
        run: go test github.com/ubgo/lath/...
        shell: pwsh

      # Separate because it is a separate module, deliberately outside the
      # workspace, which the pattern above therefore cannot reach.
      - name: Test the definition module
        id: definition
        continue-on-error: true
        run: go test ./...
        working-directory: example/.lath
        env:
          GOWORK: off
        shell: pwsh

      # continue-on-error makes a step's CONCLUSION success even when it
      # failed, so the job's green tick says nothing about what happened. This
      # writes the real outcomes where a reader will see them, because a run
      # whose result has to be dug out of the logs is a run people stop
      # reading.
      - name: Summary
        if: always()
        shell: pwsh
        run: |
          "## Windows: unsupported, tested anyway" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| Suite | Outcome |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|" >> $env:GITHUB_STEP_SUMMARY
          "| kit, pipeline, steps, cmd/lath | ${{ steps.test.outcome }} |" >> $env:GITHUB_STEP_SUMMARY
          "| example definition | ${{ steps.definition.outcome }} |" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "A failure here is not a regression: Windows is not a supported platform. It is the to-do list for making it one. See docs/TESTING.md." >> $env:GITHUB_STEP_SUMMARY
